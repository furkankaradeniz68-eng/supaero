<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow">
  <title>supAero Admin</title>
  <style>
    /* Loading screen while CMS initialises */
    body { margin: 0; background: #1a1f2e; display: flex; align-items: center; justify-content: center; min-height: 100vh; font-family: -apple-system, sans-serif; }
    #cms-loading { text-align: center; color: #9ca3af; }
    #cms-loading .mark { width: 48px; height: 48px; background: #3B7FE8; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 900; color: white; margin: 0 auto 16px; }
    #cms-loading p { font-size: 14px; margin-top: 8px; }
  </style>
</head>
<body>
  <div id="cms-loading">
    <div class="mark">sA</div>
    <strong style="color:white;font-size:16px;">supAero Admin</strong>
    <p>Wird geladen…</p>
  </div>
  <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
</body>
</html>
